services:
  backend:
    build: ./Server
    container_name: workout-backend-container
    ports:
      - "4000:3000"
    env_file:
      - ./Server/.env.docker
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: workout-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend        # adjust to your frontend folder
      args:
        VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data: